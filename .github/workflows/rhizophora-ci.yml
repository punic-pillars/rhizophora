# ============================================================
# Rhizophora CI — Performance Guardian for React Native
# v4.0
#
# This workflow runs Rhizophora's static analysis tools
# on all .tsx/.jsx files in the PR diff. It enforces:
#   - Zero bridge crossings (useState/useEffect inside handlers)
#   - Zero render traps (inline functions/objects breaking memo)
#   - Healthy SharedValue lineage (no dead or misused values)
#   - No boundary gaps (missing safe-area offsets, magic numbers)
#
# Fails the PR if any issues are found.
# ============================================================

name: Rhizophora Performance Check

on:
  pull_request:
    paths:
      - '**.tsx'
      - '**.jsx'
      - '**.ts'
      - '**.js'

jobs:
  performance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Rhizophora
        run: npm run build

      - name: Get changed .tsx/.jsx files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            **/*.tsx
            **/*.jsx

      - name: Run Rhizophora CI check
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          npx Rhizophora --ci ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Post summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Rhizophora: All performance checks passed!"
          else
            echo "❌ Rhizophora: Performance issues detected. Review the logs above."
            echo ""
            echo "Common fixes:"
            echo "  - Bridge crossings: Move useState/useEffect outside onScroll/onLayout"
            echo "  - Render traps: Wrap inline functions in useCallback, objects in useMemo"
            echo "  - SharedValue issues: Use useAnimatedStyle instead of direct JSX usage"
            echo "  - Boundary gaps: Add safe-area offsets or onLayout handlers"
          fi
